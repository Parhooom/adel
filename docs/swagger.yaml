        type: string
      error_message:
        type: string
      execution_time_ms:
        type: integer
      id:
        type: integer
      language:
        type: string
      memory_usage_mb:
        type: integer
      problem_id:
        type: integer
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  postgres.TestCase:
    properties:
      id:
        type: integer
      input_data:
        type: string
      is_active:
        type: boolean
      output_data:
        type: string
      problem_id:
        type: integer
      user_id:
        type: integer
    type: object
  postgres.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      updated_at:
        type: string
      username:
        type: string
    type: object
  token.Token:
    properties:
      expiry:
        type: string
      token:
        type: string
    type: object
  utils.Envelope:
    additionalProperties: {}
    type: object
